name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: pins on main, authkit pin equal to authfly/cli's
        run: bash tools/deps.sh --check https://raw.githubusercontent.com/authfly/cli/main/deps.lock
      - name: deps, vet, test, ui8px lint
        run: |
          bash tools/deps.sh
          go vet ./...
          go test ./...
          npx --yes ui8px@0.2.5 lint
